<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Photo Signature - Kool D. Studio</title>
    <meta name="description" content="Tự động thiết kế đẹp để in lên ảnh - 50 thiết kế, chỉnh sửa dễ dàng, tải PNG transparent">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Raleway:wght@400;600;700&family=Lora:wght@400;500;600;700&family=Lato:wght@400;700&family=Sora:wght@400;600;700&family=Merriweather:wght@400;700&family=Dancing+Script:wght@400;700&family=Pacifico&family=Satisfy&family=Great+Vibes&family=Tangerine:wght@400;700&family=Allura&family=Alex+Brush&family=Sacramento&family=Caveat:wght@400;700&family=Indie+Flower&family=Patrick+Hand&family=Amatic+SC:wght@400;700&family=Comforter:wght@400;700&family=Quicksand:wght@400;600;700&family=Nunito:wght@400;600;700&family=Fredoka:wght@400;600&family=Oswald:wght@400;600;700&family=Abril+Fatface&family=Source+Sans+Pro:wght@400;600;700&family=Unbounded:wght@400;600;700&family=Inter:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/improvements.css">
    <link rel="stylesheet" href="../assets/css/professional-layout.css">
    <link rel="stylesheet" href="../assets/css/watermark.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="../assets/js/modal.js"></script>
</head>
<body>
    <!-- Header Template Container -->
    <div id="header-container"></div>

    <div class="page-title">
        <h1>Signature & Watermark</h1>
        <p>Tạo thiết kế đẹp để in lên ảnh của bạn</p>
    </div>

    <section class="editor-section">
        <div class="editor-container">
            <div class="editor-panel">
                <div class="form-section">
                    <label class="section-label">Kiểu</label>
                    <select id="styleSelect" class="style-select"></select>
                </div>

                <div class="form-section">
                    <label class="section-label">Văn bản</label>
                    <div class="text-grid">
                        <input type="text" id="line1Input" value="Kool D." placeholder="Dòng 1">
                        <input type="text" id="line2Input" value="Studio" placeholder="Dòng 2">
                        <input type="text" id="line3Input" value="2025" placeholder="Dòng 3">
                    </div>
                </div>

                <!-- Upload Background Image -->
                <div class="form-section">
                    <label class="section-label">📷 Ảnh nền</label>
                    <input type="file" id="bgImageInput" accept="image/*" class="bg-upload-input">
                    <small style="color:#999; font-size:10px; margin-top:4px; display:block;">Tải ảnh lên để xem watermark trên ảnh thực tế</small>
                    <button class="btn btn-outline" onclick="clearBgImage()" style="width: 100%; padding: 8px 10px; font-size: 10px; margin-top: 6px;">Xóa ảnh</button>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="downloadBtn">Tải</button>
                    <button class="btn btn-secondary" onclick="resetPreview()">Reset</button>
                    <button class="btn btn-secondary" onclick="randomizeAll()">Auto</button>
                    <button class="btn btn-secondary" id="copyLinkBtn" onclick="copyShareableLink()">Sao chép</button>
                </div>

                <!-- Accordion: Tuỳ chỉnh -->
                <div class="accordion-item">
                    <button class="accordion-header" onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('active');">
                        ⚙️ Tuỳ chỉnh
                        <span class="accordion-icon">▼</span>
                    </button>
                    <div class="accordion-content">
                        <!-- Size Control -->
                        <div class="form-section">
                            <label class="form-label" style="font-size: 10px; margin-bottom: 6px; display: block;">📏 Kích thước</label>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <input type="range" id="sizeSlider" min="50" max="200" value="100" style="width: 200%;">
                                <span id="sizeValue" style="font-size: 11px; font-weight: 500; min-width: 36px;">100%</span>
                            </div>
                            <small style="color:#999; font-size:10px; margin-top:4px; display:block;">50% - 200%</small>
                        </div>

                        <!-- Font Controls -->
                        <div class="form-section">
                            <label class="section-label">Font Chính</label>
                            <select id="fontMainSelect" class="style-select" style="width: 100%; padding: 10px 12px; font-size: 12px;"></select>
                        </div>

                        <div class="form-section">
                            <label class="section-label">Font Phụ</label>
                            <select id="fontSubSelect" class="style-select" style="width: 100%; padding: 10px 12px; font-size: 12px;"></select>
                        </div>

                        <!-- Color Picker -->
                        <div style="border-top: 1px solid #e8e8e8; margin-top: 12px; padding-top: 12px;">
                            <div class="form-section" style="border: none; background: transparent; padding: 0; margin-bottom: 0;">
                                <label class="section-label" style="display: block; margin-bottom: 8px;">🎨 Màu sắc</label>
                                <div class="color-quick-palette">
                                    <div class="color-swatch-quick" style="background:#1a1a1a;" onclick="setColorQuick('#1a1a1a')" title="Đen"></div>
                                    <div class="color-swatch-quick" style="background:#2d5a3d;" onclick="setColorQuick('#2d5a3d')" title="Xanh lá"></div>
                                    <div class="color-swatch-quick" style="background:#8b4545;" onclick="setColorQuick('#8b4545')" title="Nâu đỏ"></div>
                                    <div class="color-swatch-quick" style="background:#5d4e37;" onclick="setColorQuick('#5d4e37')" title="Nâu cổ điển"></div>
                                    <div class="color-swatch-quick" style="background:#2d3748;" onclick="setColorQuick('#2d3748')" title="Xám hiện đại"></div>
                                    <div class="color-swatch-quick" style="background:#1f1f1f;" onclick="setColorQuick('#1f1f1f')" title="Đen Noir"></div>
                                </div>
                                <div class="color-input-group" style="margin-top: 12px;">
                                    <input type="color" id="colorPicker" value="#1a1a1a">
                                    <input type="text" id="colorInput" value="#1a1a1a" placeholder="#1a1a1a">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="favoritesSection" style="display:none; margin-top: 10px;">
                    <label class="section-label" style="font-size: 9px;">Đã lưu</label>
                    <div id="favoritesList"></div>
                </div>
            </div>

            <div class="preview-panel">
                <div id="watermarkPreview"></div>
            </div>
        </div>
    </section>

    <section class="gallery-section">
        <div class="gallery-container">
            <div class="gallery-title">
                <h2>50 Thiết Kế Chuyên Nghiệp</h2>
                <p>Chọn một kiểu hoặc tùy chỉnh theo ý của bạn</p>
                <div class="gallery-filters">
                    <button class="filter-btn active" data-filter="all" onclick="filterGallery('all')">Tất cả (50)</button>
                    <button class="filter-btn" data-filter="free" onclick="filterGallery('free')">Phổ thông (25)</button>
                    <button class="filter-btn" data-filter="pro" onclick="filterGallery('pro')">Yêu thích (25)</button>
                </div>
            </div>
            <div class="watermark-container" id="galleryContainer"></div>
        </div>
    </section>

    <script src="../assets/js/watermark-styles.js"></script>
    <script src="../assets/js/watermark-data.js"></script>
    <script src="../assets/js/load-template.js" data-header-path="../assets/html/header.html" data-footer-path="../assets/html/footer.html"></script>
    <script src="../assets/js/watermark.js"></script>
    <script>
        window.showAlert = (message) => {
            modal.info(message, 'Thông báo');
        };
    </script>

    <!-- Footer Template Container -->
    <div id="footer-container"></div>
</body>
</html>
