<body>
    <!-- Header Template Container -->
    <div id="header-container"></div>

    <div class="page-title">
        <h1>Signature Generator</h1>
        <p>Tạo chữ ký và watermark chuyên nghiệp với nhiều tùy chọn thiết kế</p>
    </div>

    <section class="editor-section">
        <div class="editor-container">
            <div class="editor-panel">
                <div class="form-section">
                    <label class="section-label">� Mẫu thiết kế</label>
                    <select id="styleSelect" class="style-select"></select>
                </div>

                <div class="form-section">
                    <label class="section-label">📝 Văn bản</label>
                    <div class="text-grid">
                        <input type="text" id="line1Input" value="Kool D." placeholder="Dòng chính">
                        <input type="text" id="line2Input" value="Studio" placeholder="Dòng phụ">
                        <input type="text" id="line3Input" value="2025" placeholder="Dòng cuối">
                    </div>
                </div>

                <div class="action-buttons minimal">
                    <button class="btn btn-secondary" id="shareBtn">🔗 Chia sẻ</button>
                    <button class="btn btn-primary" id="downloadBtn">📥 Tải xuống</button>
                </div>
            </div>

            <div class="preview-panel">
                <div id="signaturePreview"></div>
            </div>
        </div>
    </section>

    <section class="gallery-section">
        <div class="gallery-container">
            <div class="gallery-title">
                <h2>20 Mẫu Thiết Kế Sáng Tạo</h2>
                <p>Chọn mẫu yêu thích của bạn</p>
            </div>
            <div class="signature-container" id="galleryContainer"></div>
        </div>
    </section>

    <script src="assets/js/signature-styles.js"></script>
    <script src="assets/js/signature-data.js"></script>
    <script src="assets/js/contact-loader.js"></script>
    <script src="assets/js/load-template.js"></script>
    <script src="assets/js/signature.js"></script>
    <script>
        window.showAlert = (message) => {
            modal.info(message, 'Thông báo');
        };
    </script>

    <!-- Footer Template Container -->
    <div id="footer-container"></div>
